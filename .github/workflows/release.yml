name: Package and Release Skill

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  # The distributable skill lives inside the plugin layout; keep this in one place.
  SKILL_DIR: ios-simulator-skill/skills/ios-simulator-skill

jobs:
  package:
    name: Package skill and upload to release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate skill structure
        run: |
          echo "Validating skill directory structure..."
          test -f "$SKILL_DIR/SKILL.md" || { echo "ERROR: $SKILL_DIR/SKILL.md not found"; exit 1; }
          test -d "$SKILL_DIR/scripts" || { echo "ERROR: $SKILL_DIR/scripts not found"; exit 1; }
          test -f ios-simulator-skill/.claude-plugin/plugin.json || { echo "ERROR: plugin.json not found"; exit 1; }
          echo "✅ Skill structure validated successfully"

      - name: Create skill package
        run: |
          # Package the skill directory itself, so SKILL.md and scripts/ sit at the
          # root of the zip - what the documented
          # `unzip skill.zip -d ~/.claude/skills/ios-simulator-skill` expects.
          cd "$SKILL_DIR"
          zip -r "$GITHUB_WORKSPACE/ios-simulator-skill-${{ github.ref_name }}.zip" . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x "*.DS_Store" \
            -x "config.json"
          cd "$GITHUB_WORKSPACE"
          cp "ios-simulator-skill-${{ github.ref_name }}.zip" ios-simulator-skill.zip
          echo "📦 Created package: ios-simulator-skill-${{ github.ref_name }}.zip"
          echo "📦 Stable alias:    ios-simulator-skill.zip"
          unzip -l "ios-simulator-skill-${{ github.ref_name }}.zip" | head -20
          ls -lh ios-simulator-skill-${{ github.ref_name }}.zip

      - name: Upload package to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ios-simulator-skill-${{ github.ref_name }}.zip
            ios-simulator-skill.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Release summary
        run: |
          echo "## 🎉 Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** ios-simulator-skill-${{ github.ref_name }}.zip" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Download and extract to Claude skills directory" >> $GITHUB_STEP_SUMMARY
          echo 'curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ios-simulator-skill-${{ github.ref_name }}.zip -o skill.zip' >> $GITHUB_STEP_SUMMARY
          echo 'unzip skill.zip -d ~/.claude/skills/ios-simulator-skill' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
